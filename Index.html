<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex;
      justify-content: center; align-items: center;
      background: #f2f2f2; font-family: Arial, sans-serif;
    }
    .calculator {
      width: 320px; background: #222; padding: 20px;
      border-radius: 15px;
    }
    #display {
      width: 100%; height: 60px; margin-bottom: 15px;
      font-size: 28px; text-align: right; padding: 10px;
      border: none; border-radius: 8px;
    }
    .buttons {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    button {
      height: 55px; font-size: 20px; border: none;
      border-radius: 8px; cursor: pointer;
    }
    button:hover { opacity: 0.8; }
    .operator { background: orange; color: white; }
    .clear { background: red; color: white; }
    .equal { background: green; color: white; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="append('/')">÷</button>
      <button class="operator" onclick="append('*')">×</button>
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="operator" onclick="append('-')">−</button>
      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="operator" onclick="append('+')">+</button>
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="equal" onclick="calculate()">=</button>
      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
    </div>
  </div>
  <script>
    const display = document.getElementById("display");
    function append(value) { display.value += value; }
    function clearDisplay() { display.value = ""; }
    function deleteLast() { display.value = display.value.slice(0, -1); }
    function calculate() {
      try { display.value = eval(display.value); }
      catch { display.value = "Error"; }
    }
  </script>
</body>
</html>
